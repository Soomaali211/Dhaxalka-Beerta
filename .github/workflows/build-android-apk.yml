name: Dhismo & Update Toos ah — Android APK (Beerta & Dhaxalka)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'Beerta-iyo-Dhaxalka.apk'
      - 'README.md'
      - 'public/assets/aistudio/**'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Soo deji Koodhka Mashruuca
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diyaari Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diyaari Java JDK 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Diyaari Android SDK
        uses: android-actions/setup-android@v3

      - name: Aqbal Shatiyada Android SDK (SDK Licenses)
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ]; then
            SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$SDKMGR" ]; then
              chmod +x "$SDKMGR" || true
              yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Rakib Packages-ka & Dhis Web App-ka (dist)
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Isku xidh Mashruuca Android (Capacitor) & Ogolaanshaha GPS
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android-permissions.mjs

      - name: Dhis Signed Release APK (Taageeraya Update Toos ah)
        working-directory: android
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          export APP_VERSION_CODE=$((400 + RUN_NUM))
          export APP_VERSION_NAME="1.4.${RUN_NUM}"
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" --no-daemon
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file was not generated"
            exit 1
          fi
          cp "$APK_PATH" /tmp/Beerta-iyo-Dhaxalka.apk
          cp "$APK_PATH" ../Beerta-iyo-Dhaxalka.apk

      - name: Ku kaydi Faylka Cusub ee Beerta-iyo-Dhaxalka.apk Toos Bogga Hore ee GitHub Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- . || true
          git clean -fd || true
          if [ -n "${{ github.ref_name }}" ]; then
            git pull --rebase origin "${{ github.ref_name }}" || true
          fi
          cp /tmp/Beerta-iyo-Dhaxalka.apk ./Beerta-iyo-Dhaxalka.apk
          git add -f Beerta-iyo-Dhaxalka.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore(apk): cusboonaysii Beerta-iyo-Dhaxalka.apk v1.4.${{ github.run_number }} [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Branch push skipped"
          fi

      - name: Soo dhig Faylka Tooska ah ee Beerta-iyo-Dhaxalka.apk qaybta GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: "Beerta & Dhaxalka — Nooca v1.4.${{ github.run_number }} (APK)"
          overwrite_files: true
          body: |
            ### Beerta & Dhaxalka — Android APK (`v1.4.${{ github.run_number }}`)
            - **Soo Dejinta Tooska ah:** Hoos ka taabo **`Beerta-iyo-Dhaxalka.apk`** (ama toos uga soo dejiso qaybta **`<> Code`** ee bogga hore ee Repo-ga) si aad u rakibto (**Install** ama **Update**).
            - **Waxa Cusub (v1.4 — Falanqaynta UI/UX E1–E18):** 4 Tab oo hoose (`Khariidad · Xisaabi · Xogta · Soo saar`), Bottom-Sheets moobilka, Hal Isha Xisaabeed oo midaysan (Xuduudka, Plots-ka & Half Plots), Khariidad ballaadhan (≥70%), Stepper-ka 3-da tallaabo, iyo habaynta PDF-ka oo la fududeeyey (`Bog · Cabir · Legend · Cinwaan`).
            - **Xogtaadu way badbaadaysaa:** Haddii nooc hore telefoonka kuugu jiray, toos u taabo **Update** — kiisaskaaga iyo khariidadaha kaydsan ma tirmayaan.
          files: Beerta-iyo-Dhaxalka.apk
          make_latest: true

      - name: Kaydi Nuqulka APK qaybta Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Beerta-iyo-Dhaxalka-v1.4.${{ github.run_number }}-APK
          path: Beerta-iyo-Dhaxalka.apk
          if-no-files-found: error
