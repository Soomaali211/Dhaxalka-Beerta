<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b4a5e" />
      <stop offset="100%" stop-color="#073242" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d08a" />
      <stop offset="100%" stop-color="#c68b2c" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Subtle Octagram / Rub el Hizb geometric frame -->
  <g transform="translate(256,256)">
    <rect x="-132" y="-132" width="264" height="264" rx="18" fill="none" stroke="url(#gold)" stroke-width="14" opacity="0.9" />
    <rect x="-132" y="-132" width="264" height="264" rx="18" fill="none" stroke="url(#gold)" stroke-width="14" transform="rotate(45)" opacity="0.9" />
    <!-- Scale of Justice / Faraid Symbol inside -->
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#f3efe6" stroke-width="16" stroke-linecap="round" />
    <line x1="-74" y1="-38" x2="74" y2="-38" stroke="#f3efe6" stroke-width="14" stroke-linecap="round" />
    <line x1="-42" y1="78" x2="42" y2="78" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" />
    <!-- Left pan -->
    <path d="M-74,-38 L-98,14 L-50,14 Z" fill="none" stroke="#f5d08a" stroke-width="10" stroke-linejoin="round" />
    <path d="M-104,14 A30,22 0 0,0 -44,14 Z" fill="url(#gold)" />
    <!-- Right pan -->
    <path d="M74,-38 L50,14 L98,14 Z" fill="none" stroke="#f5d08a" stroke-width="10" stroke-linejoin="round" />
    <path d="M44,14 A30,22 0 0,0 104,14 Z" fill="url(#gold)" />
    <circle cx="0" cy="-42" r="14" fill="url(#gold)" />
